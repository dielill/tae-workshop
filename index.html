<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tragwerk Ökobilanz</title>
<style>
  :root { --text:#1d2228; --muted:#5f6b76; --line:#d9dee3; --bg:#fff; --soft:#f4f6f8; --err:#b00020; --ok:#1b7f3b; --accent:#e8590c; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: var(--bg); color: var(--text); line-height: 1.4; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .err { color: var(--err); }
  .ok { color: var(--ok); }
  .leiste { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 10px 0; }
  select { font-size: 1rem; padding: 4px 6px; }
  .layout { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 900px) { .layout { grid-template-columns: 1fr 340px; } }
  #viewer { position: relative; width: 100%; height: 60vh; min-height: 320px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fafbfc; touch-action: none; }
  #viewer canvas { display: block; }
  #legende { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .85rem; }
  #legende span.farbe { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  #info { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: .9rem; }
  #info h2 { font-size: 1.05rem; margin: 0 0 6px; }
  #info table { border-collapse: collapse; width: 100%; }
  #info td { border-bottom: 1px solid var(--line); padding: 3px 4px; vertical-align: top; }
  #info td:first-child { color: var(--muted); white-space: nowrap; padding-right: 10px; }
</style>
</head>
<body>
<h1>Tragwerk → Ökobilanz</h1>
<p class="muted">Schritt 2: Rhino-Modell als 3D-Linien. Stab anklicken zeigt seine Daten. Noch keine Berechnung.</p>

<div class="leiste">
  <label>Modell
    <select id="modellWahl">
      <option value="stahlbau">Stahlbau</option>
      <option value="holzbau">Holzbau</option>
      <option value="betonbau">Betonbau</option>
    </select>
  </label>
  <span id="status">Lade Bibliotheken …</span>
</div>

<div class="layout">
  <div>
    <div id="viewer"></div>
    <p class="muted">Ziehen: drehen · Zwei Finger / Mausrad: zoomen · Rechte Maustaste / zwei Finger ziehen: verschieben</p>
    <div id="legende"></div>
  </div>
  <div id="info"><h2>Kein Stab gewählt</h2><p class="muted">Tippe oder klicke auf einen Stab.</p></div>
</div>

<script>
(function () {
  var ORDNER = 'daten/tragwerksmodell/';
  var RHINO_BASIS = 'https://cdn.jsdelivr.net/npm/rhino3dm@8.4.0/';
  var THREE_BASIS = 'https://cdn.jsdelivr.net/npm/three@0.147.0/';
  // Farben je Layer (= Querschnitt), gut unterscheidbar
  var FARBEN = ['#1f77b4', '#d62728', '#2ca02c', '#9467bd', '#8c564b', '#e377c2', '#17becf', '#bcbd22'];
  var MARKIERT = 0x000000; // gewählter Stab

  var statusEl = document.getElementById('status');
  var viewerEl = document.getElementById('viewer');
  var infoEl = document.getElementById('info');
  var legendeEl = document.getElementById('legende');
  var wahlEl = document.getElementById('modellWahl');

  var rhino, szene, kamera, renderer, steuerung, modellGruppe, gewaehlt = null;

  function setStatus(text, klasse) { statusEl.textContent = text; statusEl.className = klasse || ''; }

  function ladeSkript(url) {
    return new Promise(function (ok, fehler) {
      var s = document.createElement('script');
      s.src = url;
      s.onload = ok;
      s.onerror = function () { fehler(new Error('Skript nicht geladen: ' + url)); };
      document.head.appendChild(s);
    });
  }
  function ladeDatei(pfad) {
    return fetch(pfad).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' für ' + pfad);
      return r.arrayBuffer();
    });
  }
  function el(tag, text, klasse) {
    var e = document.createElement(tag);
    if (text !== undefined) e.textContent = text;
    if (klasse) e.className = klasse;
    return e;
  }

  // ---------- 3D-Szene ----------
  function baueSzene() {
    szene = new THREE.Scene();
    szene.background = new THREE.Color(0xfafbfc);
    kamera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000);
    kamera.up.set(0, 0, 1); // Rhino: Z nach oben
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    viewerEl.appendChild(renderer.domElement);
    steuerung = new THREE.OrbitControls(kamera, renderer.domElement);
    steuerung.enableDamping = true;
    szene.add(new THREE.AmbientLight(0xffffff, 1));

    function groesse() {
      var b = viewerEl.clientWidth, h = viewerEl.clientHeight;
      renderer.setSize(b, h);
      kamera.aspect = b / h;
      kamera.updateProjectionMatrix();
    }
    window.addEventListener('resize', groesse);
    groesse();

    (function schleife() {
      requestAnimationFrame(schleife);
      steuerung.update();
      renderer.render(szene, kamera);
    })();

    // Klick vs. Drehen unterscheiden: nur wenn sich der Zeiger kaum bewegt hat
    var start = null;
    renderer.domElement.addEventListener('pointerdown', function (e) { start = { x: e.clientX, y: e.clientY }; });
    renderer.domElement.addEventListener('pointerup', function (e) {
      if (!start) return;
      var weg = Math.hypot(e.clientX - start.x, e.clientY - start.y);
      start = null;
      if (weg < 6) waehleAn(e.clientX, e.clientY);
    });
  }

  function waehleAn(x, y) {
    if (!modellGruppe) return;
    var r = renderer.domElement.getBoundingClientRect();
    var maus = new THREE.Vector2(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
    var ray = new THREE.Raycaster();
    ray.params.Line.threshold = 0.25; // [m] Fangradius um die Linie
    ray.setFromCamera(maus, kamera);
    var treffer = ray.intersectObjects(modellGruppe.children, false);
    setzeAuswahl(treffer.length ? treffer[0].object : null);
  }

  function setzeAuswahl(obj) {
    if (gewaehlt) gewaehlt.material.color.set(gewaehlt.userData.farbe);
    gewaehlt = obj;
    if (!obj) {
      infoEl.innerHTML = '<h2>Kein Stab gewählt</h2><p class="muted">Tippe oder klicke auf einen Stab.</p>';
      return;
    }
    obj.material.color.set(MARKIERT);
    zeigeInfo(obj.userData);
  }

  function zeigeInfo(d) {
    infoEl.innerHTML = '';
    infoEl.appendChild(el('h2', 'Stab ' + (d.ut.Stab || '?')));
    var t = el('table');
    function zeile(k, v) {
      var tr = el('tr');
      tr.appendChild(el('td', k));
      tr.appendChild(el('td', v));
      t.appendChild(tr);
    }
    // User Text unverändert, Einheit steht im Schlüssel (_m2, _m, _kN_m3)
    Object.keys(d.ut).forEach(function (k) { zeile(k, d.ut[k]); });
    zeile('Start [m]', d.start.map(function (v) { return v.toFixed(3); }).join(' / '));
    zeile('Ende [m]', d.ende.map(function (v) { return v.toFixed(3); }).join(' / '));
    zeile('Länge Geometrie [m]', d.laenge_m.toFixed(3));
    infoEl.appendChild(t);
    infoEl.appendChild(el('p', 'Quelle: ' + d.quelle, 'muted'));
  }

  // ---------- Rhino-Modell laden ----------
  function ladeModell(name) {
    setStatus('Lade TAE_' + name + '.3dm …');
    setzeAuswahl(null);
    if (modellGruppe) {
      szene.remove(modellGruppe);
      modellGruppe.children.forEach(function (c) { c.geometry.dispose(); c.material.dispose(); });
    }
    var dateiName = 'TAE_' + name + '.3dm';
    return ladeDatei(ORDNER + dateiName).then(function (buf) {
      var datei = rhino.File3dm.fromByteArray(new Uint8Array(buf));
      if (!datei) throw new Error('3dm nicht lesbar: ' + dateiName);
      if (datei.settings().modelUnitSystem !== rhino.UnitSystem.Meters) throw new Error('Modelleinheit ist nicht Meter: ' + dateiName);

      var layerNamen = [];
      for (var i = 0; i < datei.layers().count; i++) layerNamen.push(datei.layers().get(i).name);

      modellGruppe = new THREE.Group();
      var objekte = datei.objects();
      var uebersprungen = 0;
      for (var j = 0; j < objekte.count; j++) {
        var o = objekte.get(j);
        var geo = o.geometry();
        if (!(geo instanceof rhino.LineCurve)) { uebersprungen++; continue; }
        var a = geo.pointAtStart, b = geo.pointAtEnd;
        var attr = o.attributes();
        var ut = {};
        attr.getUserStrings().forEach(function (p) { ut[p[0]] = p[1]; });
        var layerIndex = attr.layerIndex;
        var farbe = FARBEN[layerIndex % FARBEN.length];

        var g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(a[0], a[1], a[2]), new THREE.Vector3(b[0], b[1], b[2])]);
        var linie = new THREE.Line(g, new THREE.LineBasicMaterial({ color: farbe }));
        linie.userData = {
          ut: ut, farbe: farbe, start: a, ende: b,
          laenge_m: Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]),
          quelle: dateiName + ', Objekt ' + (j + 1) + ' von ' + objekte.count + ', Layer „' + layerNamen[layerIndex] + '“, ID ' + attr.id
        };
        modellGruppe.add(linie);
      }
      szene.add(modellGruppe);
      zeigeLegende(layerNamen);
      kameraAufModell();
      setStatus(modellGruppe.children.length + ' Stäbe geladen' + (uebersprungen ? ', ' + uebersprungen + ' andere Objekte übersprungen' : '') + '.', 'ok');
    });
  }

  function zeigeLegende(layerNamen) {
    legendeEl.innerHTML = '';
    layerNamen.forEach(function (n, i) {
      var s = el('span');
      var f = el('span', '', 'farbe');
      f.style.background = FARBEN[i % FARBEN.length];
      s.appendChild(f);
      s.appendChild(document.createTextNode(n));
      legendeEl.appendChild(s);
    });
  }

  function kameraAufModell() {
    var box = new THREE.Box3().setFromObject(modellGruppe);
    var mitte = box.getCenter(new THREE.Vector3());
    var radius = box.getSize(new THREE.Vector3()).length() / 2;
    var abstand = radius / Math.sin(kamera.fov * Math.PI / 360) * 1.1;
    var richtung = new THREE.Vector3(1, -1.4, 0.8).normalize();
    kamera.position.copy(mitte).addScaledVector(richtung, abstand);
    kamera.near = abstand / 100;
    kamera.far = abstand * 10;
    kamera.updateProjectionMatrix();
    steuerung.target.copy(mitte);
    steuerung.update();
  }

  // ---------- Start ----------
  ladeSkript(THREE_BASIS + 'build/three.min.js')
    .then(function () { return ladeSkript(THREE_BASIS + 'examples/js/controls/OrbitControls.js'); })
    .then(function () { return ladeSkript(RHINO_BASIS + 'rhino3dm.min.js'); })
    .then(function () {
      setStatus('Lade rhino3dm (WebAssembly) …');
      return rhino3dm({ locateFile: function (f) { return RHINO_BASIS + f; } });
    })
    .then(function (r) {
      rhino = r;
      baueSzene();
      wahlEl.addEventListener('change', function () {
        ladeModell(wahlEl.value).catch(function (e) { setStatus('Fehler: ' + e.message, 'err'); });
      });
      return ladeModell(wahlEl.value);
    })
    .catch(function (e) { setStatus('Fehler: ' + e.message, 'err'); });
})();
</script>
</body>
</html>
