<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAE Workshop</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px 16px; background: #fff; color: #222; }
  h1 { font-size: 1.8rem; margin: 0 0 8px; }
  #info { color: #666; }
  .fehler { color: #b00020; }
</style>
</head>
<body>
<h1 id="ausgabe">Lade Daten …</h1>
<p id="info">Quelle: daten/mengenliste/Mengenliste_Beispielprojekt.xlsx, Blatt „Daten“</p>

<script>
(function () {
  var DATEI = 'daten/mengenliste/Mengenliste_Beispielprojekt.xlsx';
  var ausgabe = document.getElementById('ausgabe');

  function fehler(text) {
    ausgabe.textContent = 'Fehler: ' + text;
    ausgabe.className = 'fehler';
  }

  // SheetJS nachladen (kein <script src>, siehe CLAUDE.md)
  var s = document.createElement('script');
  s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
  s.onload = start;
  s.onerror = function () { fehler('SheetJS konnte nicht geladen werden.'); };
  document.head.appendChild(s);

  function start() {
    fetch(DATEI)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status + ' für ' + DATEI);
        return r.arrayBuffer();
      })
      .then(function (buf) {
        var wb = XLSX.read(buf, { type: 'array' });
        var blatt = wb.Sheets['Daten'] || wb.Sheets[wb.SheetNames[0]];
        var zeilen = XLSX.utils.sheet_to_json(blatt, { header: 1, blankrows: false, defval: '' });
        // Titel, Hinweis, dann Kopfzeile „Pos.“; Daten danach
        var kopf = zeilen.findIndex(function (z) { return z[0] === 'Pos.'; });
        if (kopf < 0) throw new Error('Kopfzeile „Pos.“ nicht gefunden.');
        var daten = zeilen.slice(kopf + 1);
        ausgabe.textContent = 'Hallo Esslingen: ' + daten.length + ' Zeilen';
      })
      .catch(function (e) { fehler(e.message); });
  }
})();
</script>
</body>
</html>
